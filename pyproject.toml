[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-mixed-clip"
version = "0.8.0.dev0"
description = "AI本地视频素材理解、信息流裂变、字幕处理与剪映可编辑交付"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
jianying = ["pyJianYingDraft>=0.3,<0.4"]
dev = ["pytest>=8"]

[project.scripts]
video-mixed-clip = "ai_local_video_mixer.cli:main"
ai-local-video-mixer = "ai_local_video_mixer.cli:main"
script-driven-mixer = "ai_local_video_mixer.cli:main"
material-intelligence = "ai_local_video_mixer.material_cli:main"
source-transcripts = "ai_local_video_mixer.source_transcription_cli:main"
information-flow-copy = "ai_local_video_mixer.information_flow_cli:main"
creative-variants = "ai_local_video_mixer.variant_cli:main"

[tool.setuptools.packages.find]
include = ["ai_local_video_mixer*"]
