[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-mixed-clip"
version = "0.1.0"
description = "本地文案驱动视频混剪、字幕对齐与剪映可编辑交付"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
jianying = ["pyJianYingDraft>=0.3,<0.4"]
dev = ["pytest>=8"]

[project.scripts]
video-mixed-clip = "ai_local_video_mixer.cli:main"
ai-local-video-mixer = "ai_local_video_mixer.cli:main"
script-driven-mixer = "ai_local_video_mixer.cli:main"

[tool.setuptools.packages.find]
include = ["ai_local_video_mixer*"]
